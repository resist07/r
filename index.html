<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northgate Wholesale — Bulk Supply for Business</title>
  <meta name="description" content="Northgate Wholesale — quality products sold by the case at wholesale prices. Order in bulk online. Trade accounts and individuals welcome." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- Loading animation, removed once the app is ready -->
  <div id="preloader" aria-hidden="true">
    <div class="preloader-inner">
      <span class="preloader-mark">📦</span>
      <span class="preloader-name">Northgate<strong>Wholesale</strong></span>
      <span class="preloader-bar"><i></i></span>
    </div>
  </div>

  <!-- Persistent header: brand, navigation, and always-visible cart -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" aria-label="Northgate Wholesale home">
        <span class="brand-mark" aria-hidden="true">📦</span>
        <span class="brand-text">Northgate<strong>Wholesale</strong></span>
      </a>

      <nav class="main-nav" aria-label="Primary">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/catalog" data-nav="catalog">Catalog</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>

      <div class="header-actions">
        <a href="#/catalog" class="btn btn-primary header-cta">Shop catalog</a>
        <button type="button" class="cart-button" data-action="open-drawer" aria-label="View your cart">
          <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 3.5h2.2l1 2m0 0 2 8.4h9.1l2.1-7.4H6.7Zm2.7 14.8a1.3 1.3 0 1 0 2.6 0 1.3 1.3 0 0 0-2.6 0Zm9.4 0a1.3 1.3 0 1 0 2.6 0 1.3 1.3 0 0 0-2.6 0Z" />
          </svg>
          <span class="cart-label">Cart</span>
          <span class="cart-count" id="cart-count" data-empty="true">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Slide-in mini-cart: pops on every add, the heart of the buy funnel -->
  <aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
    <div class="drawer-scrim" data-action="close-drawer"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Your cart">
      <header class="drawer-head">
        <h2>Your cart</h2>
        <button type="button" class="drawer-close" data-action="close-drawer" aria-label="Close cart">✕</button>
      </header>
      <div class="drawer-nudge" id="drawer-nudge"></div>
      <div class="drawer-items" id="drawer-items"></div>
      <footer class="drawer-foot" id="drawer-foot"></footer>
    </div>
  </aside>

  <!-- Single-page app views are rendered here by the router -->
  <main id="app"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark" aria-hidden="true">📦</span>
        <span class="brand-text">Northgate<strong>Wholesale</strong></span>
        <p class="footer-tagline">Bulk supply for business — sold by the case, priced for trade.</p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="#/">Home</a>
        <a href="#/catalog">Full Catalog</a>
        <a href="#/about">About Us</a>
        <a href="#/cart">Cart</a>
      </nav>
      <p class="footer-legal">
        © <span id="year"></span> Northgate Wholesale. Demo storefront — no real payments are processed.
      </p>
    </div>
  </footer>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/products.js"></script>
  <script src="assets/cart.js"></script>
  <script src="assets/particles.js"></script>
  <script src="assets/interactions.js"></script>
  <script src="assets/animations.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
